<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroAI - Care Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Header -->
  <header class="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center space-x-3">
      <h1 class="text-xl font-bold text-indigo-600">NeuroAI Platform</h1>
      <span class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-semibold">Alex Jenkins</span>
    </div>
    <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
      + Quick Log
    </button>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto p-6 space-y-6">

    <!-- Stats Section (Patterns API) -->
    <section>
      <h2 class="text-xs uppercase font-bold text-gray-400 tracking-wider mb-3">Behavior Analytics</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="stats-grid">
        <div class="bg-white p-4 rounded-xl border shadow-sm">
          <p class="text-xs text-gray-500 font-medium">Avg Episode Intensity</p>
          <p id="stat-intensity" class="text-2xl font-bold text-indigo-600 mt-1">-- / 5</p>
        </div>
        <div class="bg-white p-4 rounded-xl border shadow-sm">
          <p class="text-xs text-gray-500 font-medium">Total Episodes Logged</p>
          <p id="stat-total" class="text-2xl font-bold text-gray-800 mt-1">--</p>
        </div>
        <div class="bg-white p-4 rounded-xl border shadow-sm">
          <p class="text-xs text-gray-500 font-medium">Primary Triggers Identified</p>
          <p id="stat-triggers" class="text-sm font-semibold text-gray-700 mt-1 truncate">Loading...</p>
        </div>
      </div>
    </section>

    <!-- Timeline Activity Feed (Timeline API) -->
    <section class="bg-white rounded-xl border shadow-sm p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-4">
        <h2 class="text-lg font-bold">Activity Feed & Timeline</h2>
        <span class="text-xs text-gray-400">Live MongoDB Feed</span>
      </div>
      <div id="timeline-list" class="space-y-3">
        <p class="text-sm text-gray-400">Loading timeline data...</p>
      </div>
    </section>

  </main>

  <script>
    const CHILD_ID = '6abaa8074d399b7bd373cb2a';

    async function loadDashboard() {
      try {
        // 1. Fetch Pattern Analytics
        const resPatterns = await fetch(`/api/children/${CHILD_ID}/patterns`);
        const patterns = await resPatterns.json();

        document.getElementById('stat-intensity').textContent = `${patterns.avgIntensity || 0} / 5`;
        document.getElementById('stat-total').textContent = patterns.totalEpisodes || 0;
        document.getElementById('stat-triggers').textContent = patterns.triggers ? patterns.triggers.join(', ') : 'None';

        // 2. Fetch Timeline Events
        const resTimeline = await fetch(`/api/children/${CHILD_ID}/timeline`);
        const events = await resTimeline.json();

        const timelineContainer = document.getElementById('timeline-list');
        timelineContainer.innerHTML = '';

        const badgeColors = {
          episode: 'bg-red-100 text-red-700 border-red-200',
          note: 'bg-blue-100 text-blue-700 border-blue-200',
          progress: 'bg-green-100 text-green-700 border-green-200',
          milestone: 'bg-purple-100 text-purple-700 border-purple-200'
        };

        events.forEach(event => {
          const dateStr = new Date(event.ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          const badgeStyle = badgeColors[event.type] || 'bg-gray-100 text-gray-700';

          const card = document.createElement('div');
          card.className = 'p-4 rounded-lg border bg-gray-50 hover:bg-white transition space-y-1';
          card.innerHTML = `
            <div class="flex justify-between items-center">
              <span class="text-xs font-semibold px-2 py-0.5 rounded border ${badgeStyle}">${event.type.toUpperCase()}</span>
              <span class="text-xs text-gray-400">${dateStr}</span>
            </div>
            <h3 class="font-medium text-sm text-gray-900 mt-1">${event.title}</h3>
            ${event.details ? `<p class="text-xs text-gray-600">${event.details}</p>` : ''}
          `;
          timelineContainer.appendChild(card);
        });

      } catch (err) {
        console.error('Failed to load dashboard data:', err);
      }
    }

    loadDashboard();
  </script>
</body>
</html>
